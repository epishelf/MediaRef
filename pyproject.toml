[project]
name = "mediaref"
dynamic = ["version"]
description = "Pydantic media reference for images and video frames with lazy loading and optimized batch decoding"
readme = "README.md"
authors = [
    { name = "Suhwan Choi", email = "milkclouds00@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",   # Pydantic v2 has breaking changes on APIs
    "numpy",
    "Pillow>=9.4.0",   # to_pil_image() and PIL.Image inputs
    "opencv-python-headless>=4.12",  # no cv2 GUI use; same distribution and bound as tensorcodec[images]
    # Image codecs install everywhere; video pulls tensorcodec-av where it has wheels.
    "tensorcodec[images]>=0.3,<0.4",
    "loguru",
    "packaging>=21.0",
    "fsspec[http]>=2024.2.0",  # uniform URI dispatch — http(s)/cloud all via fsspec
]

[project.scripts]
mediaref = "mediaref._cli:main"

[project.optional-dependencies]
video = [
    "tensorcodec[images]>=0.3,<0.4",  # kept for compatibility; TensorCodec is a core dependency
]
pyav = [
    "av>=15.0",  # FFmpeg 7.0 support
]
torchcodec = [
    "torchcodec>=0.16",
]
hf = [
    "datasets>=2.14.0",  # register_feature has been stable since 2.x
    "pyarrow",           # transitively required by datasets, listed for clarity
]

[dependency-groups]
dev = [
    "ipython",
    "pytest",
    "pytest-cov",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 119
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mediaref/_version.py"
